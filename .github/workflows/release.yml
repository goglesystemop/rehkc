name: Build and publish verified Linux release

on:
  push:
    branches: [main]
    paths:
      - packaging/version.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rehkc-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install desktop runtime libraries for package checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-0t64 libgl1 libegl1 libxkbcommon-x11-0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxrender1 libxi6 libxrandr2 libxfixes3 libfontconfig1 libdbus-1-3 libx11-xcb1 binutils xdg-utils
      - name: Build, validate, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 packaging/ci_release.py --work-dir "$RUNNER_TEMP/rehkc-release"
